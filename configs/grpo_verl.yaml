model_name_or_path: Qwen/Qwen2.5-3B-Instruct
sft_adapter_path: outputs/sft/qwen2.5-3b-all-beauty
train_file: data/processed/all_beauty/verl_train.parquet
val_file: data/processed/all_beauty/verl_val.parquet
output_dir: outputs/grpo/qwen2.5-3b-all-beauty
reward_function: src/llm4rec/training/rewards.py

# Current VERL reuses the frozen base model with LoRA disabled as the reference.
# This avoids a second model allocation and is lower-memory than a separate 4-bit copy.
reference_mode: shared_frozen_base

group_size: 4
train_batch_size: 4
ppo_mini_batch_size: 4
ppo_micro_batch_size_per_gpu: 1
max_prompt_length: 896
max_response_length: 128
max_token_len_per_gpu: 2048
total_epochs: 1
total_training_steps: null
save_freq: 25
test_freq: -1
actor_learning_rate: 0.000005
kl_loss_coef: 0.01
entropy_coeff: 0.0
lora_rank: 16
lora_alpha: 32
rollout_gpu_memory_utilization: 0.30
rollout_max_num_seqs: 8
temperature: 0.8
top_p: 0.95
seed: 42
logger: console

memory:
  # Must remain false on one GPU: FSDP selects NO_SHARD and PyTorch does not
  # support summon_full_params(offload_to_cpu=True) for that strategy.
  actor_param_offload: false
  actor_optimizer_offload: true
  ref_param_offload: true
  # VERL layered LoRA summon is incompatible with FSDP1 NO_SHARD on one GPU.
  layered_summon: false
  save_lora_only: true
  gradient_checkpointing: true
  remove_padding: false
  free_cache_engine: true
  enforce_eager: true
  enable_chunked_prefill: false
